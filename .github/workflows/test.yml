name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test_and_build_and:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
      - name: install dependencies
        run: pnpm i
      - name: check spells
        run: pnpm run spell-check
      - name: check formats
        run: pnpm run fmt . --check
      - name: check lint
        run: pnpm run lint .
      - name: build
        run: pnpm run build
      - name: test
        run: pnpm run test
